# 本地 API 开发用 PostgreSQL（不开放公网；仅本机映射端口）
services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: remember_dev
      POSTGRES_USER: remember
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U remember -d remember_dev']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
